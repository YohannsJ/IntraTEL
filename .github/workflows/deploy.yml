name: Build and deploy

on:
  push:
    branches:
      - main
      - 'build/**'      # builds and pushes an image, never deploys

env:
  IMAGE: ghcr.io/yohannsj/intratel
  TAG: sha-${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (same hardening flags as production)
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp \
            --tmpfs /app/server/data:uid=1000,gid=1000 --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -p 127.0.0.1:3001:3001 "$IMAGE:$TAG"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health; then ok=1; break; fi
            sleep 2
          done
          docker logs smoke
          docker exec smoke test -s /app/dist/index.html
          docker exec smoke sh -c 'du -sh /app/node_modules /app/dist /app/server'
          docker rm -f smoke
          [ "$ok" = 1 ]
          size=$(docker image inspect -f '{{.Size}}' "$IMAGE:$TAG")
          echo "image size: $((size / 1024 / 1024)) MB"
          [ "$size" -lt $((300 * 1024 * 1024)) ] || { echo "image too big: frontend deps leaked into runtime?"; exit 1; }

      - name: Push
        run: |
          docker push "$IMAGE:$TAG"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            docker tag "$IMAGE:$TAG" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      packages: read          # the token sent to the VPS is read-only and dies with the job
    concurrency:
      group: intratel-deploy-prod
      cancel-in-progress: false
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_IP_INTRATEL }}
          port: ${{ secrets.VPS_SSH_PORT_INTRATEL }}
          username: ${{ secrets.VPS_SSH_USER_INTRATEL }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY_INTRATEL }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_TAG
          script: /usr/local/bin/deploy-intratel "$IMAGE_TAG"
